<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آلة حاسبة</title>
<style>
:root{
  --g1:#1a1040;--g2:#3b1d6e;--g3:#7a2a8f;--g4:#e0457b;
  --glass:rgba(255,255,255,.10);--glass-b:rgba(255,255,255,.22);
  --key:rgba(255,255,255,.12);--key-h:rgba(255,255,255,.22);--fn:rgba(255,255,255,.26);
  --txt:#fff;--sub:rgba(255,255,255,.65);
  --op1:#ff9a3c;--op2:#ff4f7b;--eq1:#7c5cff;--eq2:#38d9ff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --g1:#ffd6e8;--g2:#d9c7ff;--g3:#bfe3ff;--g4:#ffe3c2;
  --glass:rgba(255,255,255,.55);--glass-b:rgba(255,255,255,.9);
  --key:rgba(255,255,255,.75);--key-h:#fff;--fn:rgba(120,100,180,.18);
  --txt:#25203d;--sub:rgba(37,32,61,.6)}}
:root[data-theme="light"]{
  --g1:#ffd6e8;--g2:#d9c7ff;--g3:#bfe3ff;--g4:#ffe3c2;
  --glass:rgba(255,255,255,.55);--glass-b:rgba(255,255,255,.9);
  --key:rgba(255,255,255,.75);--key-h:#fff;--fn:rgba(120,100,180,.18);
  --txt:#25203d;--sub:rgba(37,32,61,.6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0}
body{
  background:linear-gradient(135deg,var(--g1),var(--g2),var(--g3),var(--g4));
  background-size:300% 300%;animation:bg 14s ease infinite;
  color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden;position:relative}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none;animation:float 9s ease-in-out infinite}
.b1{width:260px;height:260px;background:#ff4f7b;top:-60px;left:-60px}
.b2{width:300px;height:300px;background:#38d9ff;bottom:-90px;right:-80px;animation-delay:-4s}
@keyframes float{50%{transform:translate(30px,40px) scale(1.1)}}
.calc{
  position:relative;z-index:2;width:100%;max-width:380px;padding:18px;border-radius:34px;
  background:var(--glass);border:1px solid var(--glass-b);
  -webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);
  box-shadow:0 20px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.screen{
  direction:ltr;text-align:right;min-height:130px;padding:10px 12px 16px;margin-bottom:10px;
  display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;
  border-radius:24px;background:rgba(0,0,0,.18)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .screen{background:rgba(255,255,255,.55)}}
:root[data-theme="light"] .screen{background:rgba(255,255,255,.55)}
.expr{color:var(--sub);font-size:20px;min-height:26px;word-break:break-all}
.res{font-size:52px;font-weight:600;line-height:1.15;word-break:break-word;direction:auto;letter-spacing:-1px}
.res.long{font-size:36px}
.res.msg{font-size:34px;direction:rtl;text-align:center;font-weight:800;
  background:linear-gradient(90deg,#ffd166,#ff4f7b,#7c5cff,#38d9ff);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:pop .5s cubic-bezier(.2,1.6,.4,1),shine 3s linear infinite}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shine{to{background-position:200% 0}}
.keys{direction:ltr;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
button{
  border:1px solid var(--glass-b);border-radius:50%;aspect-ratio:1;font-size:28px;font-weight:500;
  background:var(--key);color:var(--txt);cursor:pointer;font-family:inherit;
  box-shadow:0 4px 10px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .12s,background .15s,box-shadow .15s}
button:hover{background:var(--key-h)}
button:active{transform:scale(.9);box-shadow:0 1px 3px rgba(0,0,0,.25)}
button.fn{background:var(--fn)}
button.op{background:linear-gradient(145deg,var(--op1),var(--op2));border-color:transparent;color:#fff;font-size:32px;
  box-shadow:0 6px 16px rgba(255,79,123,.45)}
button.eq{background:linear-gradient(145deg,var(--eq1),var(--eq2));border-color:transparent;color:#fff;
  box-shadow:0 6px 18px rgba(124,92,255,.55)}
button.zero{grid-column:span 2;aspect-ratio:auto;border-radius:60px;padding-left:28px;text-align:left}
.fx{position:fixed;bottom:-40px;font-size:30px;pointer-events:none;z-index:5;animation:up 2.4s ease-out forwards}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@media (max-height:640px){.res{font-size:40px}.screen{min-height:100px}button{font-size:22px}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="calc">
  <div class="screen"><div class="expr" id="expr"></div><div class="res" id="res">0</div></div>
  <div class="keys">
    <button class="fn" data-k="C">C</button>
    <button class="fn" data-k="B">⌫</button>
    <button class="fn" data-k="%">%</button>
    <button class="op" data-k="÷">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="×">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="−">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+">+</button>
    <button class="zero" data-k="0">0</button>
    <button data-k=".">.</button>
    <button class="eq" data-k="=">=</button>
  </div>
</div>
<script>
var expr="",done=false;
var eEl=document.getElementById("expr"),rEl=document.getElementById("res");
var OPS="÷×−+";

function show(r,msg){
  eEl.textContent=expr;
  rEl.textContent=r;
  rEl.className="res"+(msg?" msg":(String(r).length>9?" long":""));
}
function burst(list){
  for(var i=0;i<22;i++){
    var s=document.createElement("span");
    s.className="fx";
    s.textContent=list[i%list.length];
    s.style.left=Math.random()*95+"vw";
    s.style.animationDelay=(Math.random()*.8)+"s";
    s.style.fontSize=(22+Math.random()*26)+"px";
    document.body.appendChild(s);
    setTimeout(function(el){return function(){el.remove()}}(s),3400);
  }
  try{navigator.vibrate&&navigator.vibrate([40,30,40])}catch(e){}
}
function calc(s){
  var js=s.replace(/÷/g,"/").replace(/×/g,"*").replace(/−/g,"-").replace(/(\d+\.?\d*)%/g,"($1/100)");
  if(!/^[0-9+\-*\/.() ]+$/.test(js))return null;
  try{
    var v=Function('"use strict";return ('+js+')')();
    if(!isFinite(v))return "خطأ";
    return String(parseFloat(v.toPrecision(12)));
  }catch(e){return null}
}
function press(k){
  if(k==="C"){expr="";done=false;show("0");return}
  if(k==="B"){if(done){expr="";done=false;show("0");return}expr=expr.slice(0,-1);show(expr||"0");return}
  if(k==="="){
    if(!expr)return;
    var clean=expr.replace(/\s/g,"");
    if(clean==="2÷1"){show("مش رجوله",true);burst(["😂","🤣","💀"]);done=true;return}
    if(clean==="1111+1111"){show("عبضو بيحبك",true);burst(["💖","💕","😍","💘"]);done=true;return}
    if(clean==="7777+4444"){show("انس ظالمك يا حبيبي",true);burst(["🥺","💔","❤️‍🩹","💞"]);done=true;return}
    var out=calc(expr);
    if(out===null){show("خطأ");done=true;expr="";return}
    eEl.textContent=expr+" =";rEl.textContent=out;
    rEl.className="res"+(out.length>9?" long":"");
    expr=(out==="خطأ")?"":out;done=true;return;
  }
  var isOp=OPS.indexOf(k)>=0||k==="%";
  if(done){
    if(!isOp&&/^[0-9.]$/.test(k))expr="";
    done=false;
  }
  if(isOp){
    if(!expr){if(k==="−")expr="−";show(expr||"0");return}
    var last=expr.slice(-1);
    if(OPS.indexOf(last)>=0&&k!=="%")expr=expr.slice(0,-1);
  }
  expr+=k;
  show(expr);
}
document.querySelector(".keys").addEventListener("click",function(e){
  var b=e.target.closest("button");if(b)press(b.dataset.k);
});
document.addEventListener("keydown",function(e){
  var m={"/":"÷","*":"×","-":"−","+":"+",".":".","%":"%"};
  if(/^[0-9]$/.test(e.key))press(e.key);
  else if(m[e.key])press(m[e.key]);
  else if(e.key==="Enter"||e.key==="=")press("=");
  else if(e.key==="Backspace")press("B");
  else if(e.key==="Escape")press("C");
});
</script>
</body>
</html>
